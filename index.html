<title>NoKarl — where the fog isn't, in San Francisco</title>
<meta name="description" content="Your SF sun chasing guide. Eleven San Francisco spots scored on low cloud, visibility, wind and comfort.">
<meta name="theme-color" content="#0E161C">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="NoKarl">

<meta property="og:description" content="Where the fog isn't, in San Francisco.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://antocrimi.github.io/og-image.png">

<style>
:root{
  --ink:#0E161C; --ink-2:#16222A;
  --line:rgba(169,183,190,.18); --line-hi:rgba(169,183,190,.34);
  --fog:#A9B7BE; --fog-dim:#63757C; --fog-faint:#3B4A52;
  --clear:#F0A03C; --clear-dim:#9A6520;
  --paper:#E9EAE4;
  --disp:'Bricolage Grotesque', system-ui, sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --msg:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  --pad:16px;
}
*{box-sizing:border-box}
/* ground lives on html so the iOS overscroll bounce and the area behind
   the notch and home indicator stay dark too */
html{-webkit-text-size-adjust:100%; background:var(--ink); min-height:100%}
body{
  margin:0; min-height:100dvh; background:var(--ink); color:var(--paper);
  font-family:var(--msg); line-height:1.45; font-size:17px;
  padding:calc(18px + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right))
          calc(44px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--clear); color:var(--ink)}
.wrap{max-width:760px; margin:0 auto}

/* ══ masthead + segmented toggle ════════════════════════════════ */
.titlerow{display:flex; align-items:center; justify-content:space-between; gap:14px; margin:22px 0 12px}
h1{margin:0; flex:0 1 auto; min-width:0}
/* wordmark is width-driven: 40vw on phones for prominence without dominance,
   climbing to a 400px ceiling on desktop */
h1 img{display:block; width:clamp(165px, 44vw, 440px); height:auto; object-fit:contain}

/* unit override — muted, secondary. Default is inferred from locale. */
.units{display:flex; align-items:center; gap:1px; flex:0 0 auto}
.units button{font-family:var(--mono); font-size:15px; letter-spacing:.04em;
  background:none; border:0; padding:10px 9px; min-height:44px; cursor:pointer;
  color:var(--fog-faint); transition:color .2s; -webkit-tap-highlight-color:transparent}
.units button[aria-pressed="true"]{color:var(--fog)}
.units button:focus-visible{outline:2px solid var(--clear); outline-offset:2px; border-radius:3px}
.units s{display:inline-block; width:1px; height:15px; margin:0 3px;
  background:var(--fog-faint); text-decoration:none}

svg.g{fill:currentColor}

.sub{max-width:46ch; color:var(--fog); font-size:16px; margin:2px 0 0}

/* ══ section headings — label, then a rule to the edge ════════ */
.sec{display:flex; align-items:center; gap:15px; margin:40px 0 16px;
  font-family:var(--disp); font-weight:700; font-size:20px;
  letter-spacing:-.024em; color:var(--paper)}
.sec::after{content:""; flex:1 1 auto; height:1px; background:var(--line)}
.sec:first-of-type{margin-top:24px}

/* ══ verdict — the pick, in full accent ════════════════════════
   min-height holds the box so the quiet state doesn't jump the page */
.verdict{min-height:80px; margin-bottom:26px}
.v-row{display:flex; align-items:center; gap:12px}
.v-ico{flex:0 0 auto; color:var(--clear); display:grid; place-items:center}
.v-ico svg{width:30px; height:30px; display:block}
.v-name{font-family:var(--disp); font-weight:700; font-size:27px;
  line-height:1.05; letter-spacing:-.028em; color:var(--clear); min-width:0}
.v-temp{margin-left:auto; flex:0 0 auto; font-family:var(--disp); font-weight:700;
  font-size:42px; line-height:.92; letter-spacing:-.042em; color:var(--clear)}
.v-cond{display:block; margin-top:9px; font-family:var(--mono); font-size:13px;
  letter-spacing:.02em; color:var(--fog-dim)}
.v-cond b{color:var(--fog); font-weight:400}
.v-row.quiet .v-ico,.v-row.quiet .v-name{color:var(--fog)}
.v-row.quiet .v-name{font-size:24px}

/* ══ time scrubber ═════════════════════════════════════════════ */
.timebar{margin-top:15px; padding-top:13px; border-top:1px solid var(--line)}
.tb-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px}
.tb-at{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:-.022em; color:var(--paper)}
.tb-rel{font-family:var(--mono); font-size:11px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--fog-dim)}
/* the thumb is Karl, mirrored to face the way the logo does.
   Track thickens and the fill goes full amber while you drag. */
#time{-webkit-appearance:none; appearance:none; width:100%; height:48px;
  margin:0; display:block; background:transparent; cursor:grab; --p:0%;
  touch-action:pan-y}
#time:active{cursor:grabbing}

#time::-webkit-slider-runnable-track{
  height:11px; border-radius:999px;
  background:linear-gradient(90deg,var(--clear-dim) 0 var(--p),rgba(169,183,190,.15) var(--p) 100%);
  transition:background .2s linear}
#time:active::-webkit-slider-runnable-track,
#time:focus-visible::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,var(--clear) 0 var(--p),rgba(169,183,190,.24) var(--p) 100%)}
#time::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
  width:34px; height:34px; margin-top:-11.5px; border:0; background:transparent;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'%3E%3Cg%20transform='translate(256,0)%20scale(-1,1)'%3E%3Cpath%20fill='%23F4F4F0'%20d='M160,40A88.09,88.09,0,0,0,81.29,88.67,64,64,0,1,0,72,216h88a88,88,0,0,0,0-176Z'/%3E%3C/g%3E%3C/svg%3E");
  background-size:contain; background-position:center; background-repeat:no-repeat;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));
  transition:transform .26s cubic-bezier(.34,1.16,.42,1)}
#time:hover::-webkit-slider-thumb,
#time:active::-webkit-slider-thumb,
#time:focus-visible::-webkit-slider-thumb{transform:scale(1.15)}

#time::-moz-range-track{height:11px; border-radius:999px; background:rgba(169,183,190,.15)}
#time::-moz-range-progress{height:11px; border-radius:999px; background:var(--clear-dim);
  transition:background .2s linear}
#time:active::-moz-range-progress,#time:focus-visible::-moz-range-progress{background:var(--clear)}
#time::-moz-range-thumb{width:34px; height:34px; border:0; background:transparent;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'%3E%3Cg%20transform='translate(256,0)%20scale(-1,1)'%3E%3Cpath%20fill='%23F4F4F0'%20d='M160,40A88.09,88.09,0,0,0,81.29,88.67,64,64,0,1,0,72,216h88a88,88,0,0,0,0-176Z'/%3E%3C/g%3E%3C/svg%3E");
  background-size:contain; background-position:center; background-repeat:no-repeat;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));
  transition:transform .26s cubic-bezier(.34,1.16,.42,1)}
#time:hover::-moz-range-thumb,#time:active::-moz-range-thumb{transform:scale(1.15)}
#time:focus-visible{outline:none}
.tb-scale{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--fog-faint)}

/* ══ ridge ══════════════════════════════════════════════════════ */
/* no container: the map sits directly on the page ground */
.ridge{margin-bottom:30px}
.ridge-head{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono);
  font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--fog-dim); margin-bottom:9px}
.ridge-head b{color:var(--fog); font-weight:400; text-align:center}
.stage{position:relative; width:100%; aspect-ratio:900/250}
.stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.dot{position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%;
  background:var(--fog-faint); border:1px solid var(--fog-dim);
  transition:background .18s linear, border-color .18s linear}
.dot.on{background:var(--clear); border-color:var(--clear)}
.dot svg{display:none}
.dot.pick{width:22px; height:22px; margin:-11px 0 0 -11px; background:none; border:none;
  color:var(--clear); display:grid; place-items:center}
.dot.pick svg{display:block; width:100%; height:100%}

/* Hilltops name themselves on the map at the height they sit; the rest
   name themselves in the rail. Tiers are not fixed — every label is
   measured and packed at the current width, so nothing ever collides.
   A hairline runs from each label back to the point it belongs to. */
.peaks{position:absolute; inset:0; pointer-events:none}
.pk{position:absolute; transform:translateX(-50%); white-space:nowrap;
  font-family:var(--msg); font-size:11.5px; font-weight:400; line-height:1.25;
  color:var(--fog); text-shadow:0 1px 4px var(--ink), 0 0 9px var(--ink), 0 0 3px var(--ink)}
.pk::after{content:""; position:absolute; top:100%; left:var(--lx,50%);
  width:1px; height:var(--gap,0px); background:var(--fog-faint)}
.pk.on{color:var(--clear)}
.pk.on::after{background:var(--clear-dim)}
.pk.pick{font-weight:600}

/* rail: a tick per spot, tall enough to reach its own label. Labels carry
   the page ground and sit above, so a tick crossing a row is masked. */
.rail{position:relative; height:54px}
.rail i{position:absolute; top:0; width:1px; margin-left:-.5px; z-index:0;
  height:7px; background:var(--fog-faint)}
.rail i.on{background:var(--clear-dim)}
.rail b{position:absolute; top:0; transform:translateX(-50%);
  font-family:var(--msg); font-size:11.5px; font-weight:400; letter-spacing:0;
  color:var(--fog); white-space:nowrap; line-height:1.25;
  background:var(--ink); padding:0 4px; z-index:1}
.rail b.on{color:var(--clear)}
.rail b.pick{font-weight:600}
@media(max-width:374px){ .pk,.rail b{font-size:10.5px} }
@media(min-width:560px){ .pk,.rail b{font-size:12px} }

/* ══ full data — split at the fog line ════════════════════════ */
.rows{display:block}
.tr{display:grid; grid-template-columns:34px 1fr auto; gap:14px; align-items:center;
  padding:15px 0; border-bottom:1px solid var(--line)}
.rows .tr:last-child{border-bottom:0}
.ri{color:var(--paper); display:grid; place-items:center}
.ri svg{width:29px; height:29px}
.nm{display:block; font-family:var(--disp); font-weight:700; font-size:19px;
  line-height:1.1; letter-spacing:-.022em; color:var(--paper)}
.strip{display:block; margin-top:6px; font-family:var(--mono); font-size:12.5px;
  letter-spacing:.02em; color:var(--fog-dim); line-height:1.45}
.strip b{color:var(--fog); font-weight:400}
.tp{font-family:var(--disp); font-weight:700; font-size:21px; line-height:1;
  letter-spacing:-.032em; color:var(--paper); text-align:right}

.attr{margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-family:var(--mono); font-size:11px; line-height:1.8; color:var(--fog-faint)}
.attr a{color:var(--fog-dim)}
.sign{margin:24px 0 0; padding-top:17px; border-top:1px solid var(--line);
  text-align:right; font-size:15px; color:var(--fog-dim)}

@media(min-width:560px){
  :root{--pad:24px}
  h1 img{width:clamp(264px, 37.4vw, 440px)}
  .stage{aspect-ratio:900/220}
  .verdict{min-height:126px}
  .v-name{font-size:30px}
  .v-temp{font-size:58px}
  .v-ico svg{width:30px; height:30px}
  .tr{grid-template-columns:40px 1fr auto; gap:18px}
  .ri svg{width:33px; height:33px}
  .sec{font-size:22px; margin:46px 0 18px}
  .nm{font-size:20px}
  .tp{font-size:23px}
  .v-name{font-size:30px}
  .v-temp{font-size:48px}
  .verdict{min-height:88px}
  .nm{font-size:18px}
}
@media(min-width:860px){ .stage{aspect-ratio:900/190} }
@media(prefers-reduced-motion:reduce){
  .dot,.bar i,#time::-webkit-slider-thumb,#time::-moz-range-thumb{transition:none}
}
</style>
</head>

<div class="wrap">

  <div class="titlerow">
    <h1><img src="logo.png" alt="Karl" width="638" height="196"></h1>
    <div class="units" id="units" role="group" aria-label="Temperature unit">
      <button data-u="C" aria-pressed="false">°C</button><s aria-hidden="true"></s><button data-u="F" aria-pressed="true">°F</button>
    </div>
  </div>

  <p class="sub">Your SF sun chasing guide.</p>

  <div class="ridge">
    <h2 class="sec">Top Spot</h2>
    <div class="verdict" id="verdict" aria-live="polite"></div>
    <div class="ridge-head"><span>← West</span><span>East →</span></div>
    <div class="stage" id="stage">
      <svg viewBox="0 0 900 250" preserveAspectRatio="none" aria-label="Cross section of San Francisco from Ocean Beach to India Basin showing where low cloud sits against the Twin Peaks ridge">
        <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#A9B7BE" stop-opacity=".55"/>
          <stop offset="70%" stop-color="#A9B7BE" stop-opacity=".30"/>
          <stop offset="100%" stop-color="#A9B7BE" stop-opacity="0"/>
        </linearGradient></defs>
        <path id="fogBody" d="" fill="url(#fg)"/>
        <path id="terrain" d="" fill="#1E2B33" stroke="rgba(169,183,190,.34)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <div id="dots"></div>
      <div class="peaks" id="peaks"></div>
    </div>
    <div class="rail" id="rail"></div>

    <div class="timebar">
      <div class="tb-head"><span class="tb-at" id="tbAt">Now</span><span class="tb-rel" id="tbRel">Live</span></div>
      <input type="range" id="time" min="0" max="23" step="1" value="0"
             aria-label="Time, hours from now" aria-valuetext="Now">
      <div class="tb-scale"><span>Now</span><span>+12h</span><span>+24h</span></div>
    </div>
  </div>

  <div id="board"></div>

  <p class="attr">
    Weather data by <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a>, CC BY 4.0.
    Non-commercial use. Fog climatology is a static local estimate, not measured.
  </p>
  <p class="sign">Enjoy your day! Anto</p>
</div>

 palm:'<path d="M237.79,53.23a66.86,66.86,0,0,0-97.74,0,72.21,72.21,0,0,0-12.05,17,72.21,72.21,0,0,0-12-17,66.86,66.86,0,0,0-97.74,0,8,8,0,0,0,2.6,12.85L77,90.55a71.42,71.42,0,0,0-43.36,33.21,70.64,70.64,0,0,0-7.2,54.32A8,8,0,0,0,39,182.36l81-61.68V224a8,8,0,0,0,16,0V120.68l81,61.68a8,8,0,0,0,12.57-4.28,70.64,70.64,0,0,0-7.2-54.32A71.42,71.42,0,0,0,179,90.55l56.22-24.47a8,8,0,0,0,2.6-12.85ZM67.08,48a51.13,51.13,0,0,1,37.28,16.26,56.53,56.53,0,0,1,14.26,26.93L39,56.53A50.5,50.5,0,0,1,67.08,48ZM40,161.5a54.82,54.82,0,0,1,7.47-29.7,55.55,55.55,0,0,1,34-25.89A56.52,56.52,0,0,1,96.1,104a55.82,55.82,0,0,1,16.23,2.41ZM208.5,131.8A54.82,54.82,0,0,1,216,161.5l-72.3-55.1a56.3,56.3,0,0,1,64.83,25.4ZM137.38,91.19a56.53,56.53,0,0,1,14.26-26.93A51.13,51.13,0,0,1,188.92,48,50.5,50.5,0,0,1,217,56.53Z"/>',
 sail:'<path d="M247.21,172.53A8,8,0,0,0,240,168H144V144h72a8,8,0,0,0,5.92-13.38L144,44.91V8a8,8,0,0,0-14.21-5l-104,128A8,8,0,0,0,32,144h96v24H16a8,8,0,0,0-6.25,13l29.6,37a15.93,15.93,0,0,0,12.49,6H204.16a15.93,15.93,0,0,0,12.49-6l29.6-37A8,8,0,0,0,247.21,172.53ZM197.92,128H144V68.69ZM48.81,128,128,30.53V128Zm155.35,80H51.84l-19.2-24H223.36Z"/>',
 fogx:'<path d="M120,208H72a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Zm64-16H160a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Zm-24,32H104a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Zm72-124a76.08,76.08,0,0,1-76,76H76A52,52,0,0,1,76,72a53.26,53.26,0,0,1,8.92.76A76.08,76.08,0,0,1,232,100Zm-16,0A60.06,60.06,0,0,0,96,96.46a8,8,0,0,1-16-.92q.21-3.66.77-7.23A38.11,38.11,0,0,0,76,88a36,36,0,0,0,0,72h80A60.07,60.07,0,0,0,216,100Z"/>',
 sun:'<path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm8,24a64,64,0,1,0,64,64A64.07,64.07,0,0,0,128,64ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/>'
};
const ico=(k,cls)=>`<svg class="g ${cls||''}" viewBox="0 0 256 256" aria-hidden="true">${G[k]}</svg>`;

const SPOTS=[
 {n:"Ocean Beach",    g:"wave", lat:37.7590,lon:-122.5100,rel:26,x:40, y:218},
 {n:"GG Park",        g:"tree", lat:37.7720,lon:-122.4600,rel:48,x:248,y:200},
 {n:"Twin Peaks",     g:"peak", lat:37.7544,lon:-122.4477,rel:55,x:330,y:104,h:1},
 {n:"Glen Canyon",    g:"tree", lat:37.7400,lon:-122.4430,rel:68,x:387,y:158},
 {n:"Corona Heights", g:"peak", lat:37.7650,lon:-122.4380,rel:62,x:444,y:142,h:1},
 {n:"Fort Mason",     g:"sail", lat:37.8060,lon:-122.4320,rel:52,x:505,y:190},
 {n:"Dolores Park",   g:"palm", lat:37.7596,lon:-122.4269,rel:78,x:563,y:196},
 {n:"McLaren",        g:"tree", lat:37.7180,lon:-122.4180,rel:79,x:628,y:172},
 {n:"Bernal Heights", g:"peak", lat:37.7431,lon:-122.4160,rel:82,x:690,y:156,h:1},
 {n:"Potrero Hill",   g:"slope",lat:37.7600,lon:-122.3990,rel:84,x:780,y:182,h:1},
 {n:"Dogpatch",       g:"dog"  ,lat:37.7615,lon:-122.3872,rel:85,x:860,y:212}
];
/* one profile. clarity-forward, since fog is the whole point;
   ideal sits at 66°F, the midpoint of the old Move/Chill pair. */
const W={c:.42, v:.13, w:.22, t:.23, ideal:66};
const HOURS=24, CLEAR=45, VBW=900, VBH=250, GROUND=246;

/* Catmull-Rom → cubic bezier, so the section reads as rolling ground */
function smooth(pts){
  const p=[{x:-70,y:pts[0].y+8},...pts,{x:VBW+70,y:pts[pts.length-1].y+6}];
  let d=`L${p[1].x},${p[1].y}`;
  for(let i=1;i<p.length-2;i++){
    const a=p[i-1],b=p[i],c=p[i+1],e=p[i+2],k=7;
    d+=` C${(b.x+(c.x-a.x)/k).toFixed(1)},${(b.y+(c.y-a.y)/k).toFixed(1)}`
      +` ${(c.x-(e.x-b.x)/k).toFixed(1)},${(c.y-(e.y-b.y)/k).toFixed(1)} ${c.x},${c.y}`;
  }
  return d;
}
const RIDGE=[{x:0,y:224},...SPOTS.map(s=>({x:s.x,y:s.y})),{x:VBW,y:222}];

const $=i=>document.getElementById(i), cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const TZ="America/Los_Angeles";

/* ── unit system: inferred from locale, overridable ─────────────
   Fahrenheit is used by the US, Liberia, Myanmar and a handful of
   Caribbean and Pacific territories. Everywhere else is Celsius. */
const F_REGIONS=new Set(["US","LR","MM","BS","BZ","KY","PW","FM","MH","GU","PR","VI","AS","MP","TC","MS","AG","KN"]);
function inferUnit(){
  try{
    const loc=new Intl.Locale(navigator.language);
    if(loc.measurementSystem) return loc.measurementSystem==="us" ? "F" : "C";
    const r=(loc.maximize&&loc.maximize().region)||loc.region;
    return F_REGIONS.has(r) ? "F" : "C";
  }catch(e){ return "F"; }
}
let S={unit:inferUnit(), h:0, frames:null};

const t2 = f => S.unit==="C" ? Math.round((f-32)*5/9) : Math.round(f);
const w2 = m => S.unit==="C" ? Math.round(m*1.609) : Math.round(m);
const wu = () => S.unit==="C" ? "km/h" : "mph";

const fmtH=e=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric"}).format(new Date(e*1000));
const fmtD=e=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(new Date(e*1000));
const stamp=(t,k)=> k===0 ? "Now" : `${fmtD(t)} ${fmtH(t)}`;
const relLabel=k=> k===0 ? "Live" : `+${k}h`;

/* score always computed in °F and mph — display units never touch it */
function score(d){return Math.round(
  (100-cl(d.lowCloud,0,100))*W.c + (cl(d.vis/16000,0,1)*100)*W.v +
  (100-cl((d.wind-8)*5,0,100))*W.w + (100-cl(Math.abs(d.temp-W.ideal)*5.5,0,100))*W.t);}

/* ── fallback: 48 hours of SF fog behaviour ────────────────────
     Diurnal cycle peaks near 5am and burns off mid-afternoon, with a
     deep marine push building on the second day so the sweep covers
     the socked-in case the quiet rule exists for. Hour-of-day is read
     in SF time, not the viewer's — the cycle belongs to the city. */
function simulate(){
  const now=Math.floor(Date.now()/1000);
  const h0=+new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",hour12:false})
             .format(new Date());
  const out=[];
  for(let k=0;k<HOURS;k++){
    const hr=(h0+k)%24;
    const diurnal=cl(50+38*Math.cos((hr-5)/24*2*Math.PI),0,100);
    const deep=cl((k-13)/7,0,1);                 /* Karl takes the city */
    const push=cl(diurnal+deep*26,0,100);
    out.push({t:now+k*3600, spots:SPOTS.map(s=>{
      const ex=(100-s.rel)/100;
      const low=cl(Math.max(push*1.55*ex-8, deep*92*(.78+.22*ex)),0,100);
      return {...s, lowCloud:low, temp:70-low*.17-push*.03,
              wind:6+push*.11+ex*13, vis:low>70?1800:16000-low*100};
    })});
  }
  return out;
}

/* ── live: every hour reads the same hourly array, so the whole
     48-hour sweep is internally consistent ─────────────────────── */
async function fetchLive(){
  const u="https://api.open-meteo.com/v1/forecast"
   +"?latitude="+SPOTS.map(s=>s.lat).join(",")+"&longitude="+SPOTS.map(s=>s.lon).join(",")
   +"&hourly=temperature_2m,cloud_cover_low,visibility,wind_speed_10m"
   +"&forecast_days=3&timeformat=unixtime&temperature_unit=fahrenheit"
   +"&wind_speed_unit=mph&timezone="+TZ;
  const c=new AbortController(), to=setTimeout(()=>c.abort(),8000);
  const r=await fetch(u,{signal:c.signal}); clearTimeout(to);
  if(!r.ok) throw new Error(r.status);
  const j=await r.json(), A=Array.isArray(j)?j:[j];
  const T=A[0].hourly.time, now=Math.floor(Date.now()/1000);
  let base=T.findIndex(t=>t>now); base=base<1?0:base-1;
  const out=[];
  for(let k=0;k<HOURS;k++){
    const i=Math.min(base+k,T.length-1);
    out.push({t:T[i], spots:SPOTS.map((s,n)=>{
      const h=A[n].hourly;
      return {...s, lowCloud:h.cloud_cover_low[i]??0, temp:h.temperature_2m[i],
              wind:h.wind_speed_10m[i], vis:h.visibility[i]??16000};
    })});
  }
  return out;
}

/* ── map layer is built once. Scrubbing only toggles classes, so the
     expensive measure-and-pack pass runs on load and on resize only. ── */
const HILLS=SPOTS.filter(s=>s.h), FLATS=SPOTS.filter(s=>!s.h);
function buildMap(){
  $("dots").innerHTML=SPOTS.map(s=>
    `<span class="dot" data-k="${s.n}" title="${s.n}"
      style="left:${(s.x/VBW*100).toFixed(3)}%; top:${(s.y/VBH*100).toFixed(3)}%">${ico("sun")}</span>`).join("");
  $("peaks").innerHTML=HILLS.map(s=>
    `<b class="pk" data-k="${s.n}" data-x="${s.x}" data-y="${s.y}">${s.n}</b>`).join("");
  $("rail").innerHTML=
    SPOTS.map(s=>`<i data-k="${s.n}" style="left:${(s.x/VBW*100).toFixed(3)}%"></i>`).join("")
   +FLATS.map(s=>`<b data-k="${s.n}" data-x="${s.x}">${s.n}</b>`).join("");
}

/* Measure every label and pack it so nothing overlaps at this width.
   Hilltop labels are placed in 2D, since each sits above its own summit
   and two labels at different heights can share horizontal space. */
function relayout(){
  const rail=$("rail"), stage=$("stage");
  if(!rail||!stage) return;
  const W=rail.clientWidth, H=stage.clientHeight;
  if(!W||!H){ requestAnimationFrame(relayout); return; }   /* not laid out yet */
  const PAD=7, boxes=[];

  [...$("peaks").children].forEach(n=>{
    const cx=+n.dataset.x/VBW*W, dotY=+n.dataset.y/VBH*H,
          w=n.offsetWidth, lh=n.offsetHeight;
    let l=cl(cx-w/2, 0, Math.max(0,W-w));
    const r=l+w;
    let y=dotY-13-lh;                       /* 13px of clearance above the dot */
    for(let guard=0; guard<8; guard++){
      const hit=boxes.find(b=>l<b.r+PAD && r>b.l-PAD && Math.abs(y-b.y)<lh+5);
      if(!hit) break;
      y=hit.y-lh-5;
      if(y<0){ y=0; break; }
    }
    boxes.push({l,r,y});
    n.style.left=((l+w/2)/W*100).toFixed(3)+"%";
    n.style.top=y.toFixed(1)+"px";
    n.style.setProperty("--gap",(dotY-(y+lh)).toFixed(1)+"px");
    n.style.setProperty("--lx",(cx-l).toFixed(1)+"px");
  });

  const ROW=15, TOP=13, ends=[], tier={};
  [...$("rail").querySelectorAll("b")].forEach(n=>{
    const cx=+n.dataset.x/VBW*W, w=n.offsetWidth;
    let l=cl(cx-w/2, 0, Math.max(0,W-w));
    let t=0; while(ends[t]!==undefined && l<ends[t]+PAD) t++;
    ends[t]=l+w; tier[n.dataset.k]=t;
    n.style.left=((l+w/2)/W*100).toFixed(3)+"%";
    n.style.top=(TOP+t*ROW)+"px";
  });
  /* each tick grows to meet its own label; hilltop ticks stay short */
  [...$("rail").querySelectorAll("i")].forEach(n=>{
    const t=tier[n.dataset.k];
    n.style.height=(t===undefined?7:TOP+t*ROW)+"px";
  });
  $("rail").style.height=(TOP+ends.length*ROW+4)+"px";
}

/* Clarity decides the side of the line. Wind decides the order within it,
   so the calmest spot sits on top and the exposed ones sink. */
function split(k){
  const all=S.frames[k].spots.map(d=>({...d,score:score(d),clear:d.lowCloud<CLEAR}));
  /* compare the wind the user can see, so equal readings tie and
     fall through to score rather than to a hidden decimal */
  const by=(a,b)=>Math.round(a.wind)-Math.round(b.wind)||b.score-a.score;
  return {sun:all.filter(d=>d.clear).sort(by), fog:all.filter(d=>!d.clear).sort(by)};
}

/* ── the answer, sitting on top of the map ─────────────────────── */
function paintVerdict(sun,k){
  if(!sun.length){                      /* quiet rule: nothing above the line */
    $("verdict").innerHTML=`<div class="v-row quiet">
      <span class="v-ico">${ico("fogx")}</span>
      <span class="v-name">Karl's winning${k===0?" right now":""}.</span></div>`;
    return;
  }
  const t=sun[0];
  $("verdict").innerHTML=`<div class="v-row">
      <span class="v-ico">${ico(t.g)}</span>
      <span class="v-name">${t.n}</span>
      <span class="v-temp">${t2(t.temp)}°</span></div>
    <span class="v-cond"><b>${Math.round(t.lowCloud)}%</b> low cloud · <b>${w2(t.wind)}</b> ${wu()} wind</span>`;
}

function paint(){
  const k=S.h, fr=S.frames[k], {sun,fog}=split(k);
  paintVerdict(sun,k);
  $("tbAt").textContent=stamp(fr.t,k);
  $("time").style.setProperty("--p",(k/(HOURS-1)*100).toFixed(1)+"%");
  $("tbRel").textContent=relLabel(k);
  $("time").setAttribute("aria-valuetext",stamp(fr.t,k));

  const row=(s,i,cls)=>`
    <div class="tr ${cls} ${cls==="clear"&&i===0?"top":""}">
      <span class="ri">${ico(s.g)}</span>
      <span><span class="nm">${s.n}</span>
        <span class="strip"><b>${Math.round(s.lowCloud)}%</b> low cloud · <b>${w2(s.wind)}</b> ${wu()} wind</span></span>
      <span class="tp">${t2(s.temp)}°</span>
    </div>`;
  /* rows are wrapped so the rule falls only between them, never at an edge */
  $("board").innerHTML=
    `<h2 class="sec">Clear spots</h2><div class="rows">${sun.map((s,i)=>row(s,i,"clear")).join("")}</div>`+
    `<h2 class="sec">Under Karl</h2><div class="rows">${fog.map((s,i)=>row(s,i,"fog")).join("")}</div>`;

  const pick=sun.length?sun[0].n:null;
  const state={};
  fr.spots.forEach(s=>state[s.n]={on:s.lowCloud<CLEAR, pick:s.n===pick});
  [["dots","dot"],["peaks","pk"],["rail","b"]].forEach(([id])=>{
    [...$(id).children].forEach(n=>{
      const st=state[n.dataset.k]; if(!st) return;
      n.classList.toggle("on",st.on);
      if(n.tagName!=="I") n.classList.toggle("pick",st.pick);
    });
  });

  const w=fr.spots.slice(0,4).reduce((t,s)=>t+s.lowCloud,0)/4,
        e=fr.spots.slice(-4).reduce((t,s)=>t+s.lowCloud,0)/4,
        wy=GROUND-w*1.55, ey=GROUND-e*1.55;
  $("fogBody").setAttribute("d",
    `M0,${GROUND} L0,${wy} C240,${wy-18} 330,${wy+12} 400,${(wy+ey)/2} C520,${ey-10} 700,${ey} ${VBW},${ey} L${VBW},${GROUND} Z`);

}

$("terrain").setAttribute("d", `M0,${GROUND} `+smooth(RIDGE)+` L${VBW},${GROUND} Z`);

/* ── controls ──────────────────────────────────────────────────── */
/* coalesce to one repaint per frame — a drag fires input far faster than
   the browser paints, and each paint rebuilds the list, dots and rail */
let raf=null, rz=null;
const safeLayout=()=>{ try{ relayout(); }catch(e){} };
$("time").addEventListener("input",e=>{
  S.h=+e.target.value;
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=null; paint(); });
},{passive:true});
$("units").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  S.unit=b.dataset.u;
  [...$("units").querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  paint();
});

(async()=>{
  [...$("units").querySelectorAll("button")]
    .forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.u===S.unit)));
  buildMap();
  try{ S.frames=await fetchLive(); }
  catch(err){ S.frames=simulate(); }
  paint();                       /* content first — never gated on measurement */
  safeLayout();
  /* one observer covers first layout, webfont swap, rotation and resize */
  if(window.ResizeObserver) new ResizeObserver(()=>{
    clearTimeout(rz); rz=setTimeout(safeLayout,120);
  }).observe($("rail"));
  else addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(safeLayout,140); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(safeLayout);
})();
})();
</script>
