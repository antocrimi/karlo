<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoKarl — where the fog isn't, in San Francisco</title>
<meta name="description" content="Karl doesn't own the whole city. Here's where he isn't. Twelve San Francisco spots scored on low cloud, visibility, wind and comfort.">
<meta name="theme-color" content="#0E161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoKarl">

<meta property="og:description" content="Where the fog isn't, in San Francisco.">
<meta property="og:type" content="website">

<style>
:root{
  --ink:#0E161C; --ink-2:#16222A;
  --line:rgba(169,183,190,.18); --line-hi:rgba(169,183,190,.34);
  --fog:#A9B7BE; --fog-dim:#63757C; --fog-faint:#3B4A52;
  --clear:#F0A03C; --clear-dim:#9A6520;
  --paper:#E9EAE4;
  --disp:'Bricolage Grotesque', system-ui, sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --msg:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  --pad:16px;
}
*{box-sizing:border-box}
/* ground lives on html so the iOS overscroll bounce and the area behind
   the notch and home indicator stay dark too */
html{-webkit-text-size-adjust:100%; background:var(--ink); min-height:100%}
body{
  margin:0; min-height:100dvh; background:var(--ink); color:var(--paper);
  font-family:var(--msg); line-height:1.45; font-size:17px;
  padding:calc(18px + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right))
          calc(44px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:var(--clear); color:var(--ink)}
.wrap{max-width:760px; margin:0 auto}

/* ══ masthead + segmented toggle ════════════════════════════════ */
.titlerow{display:flex; align-items:center; justify-content:space-between; gap:14px; margin:22px 0 12px}
h1{margin:0; flex:0 1 auto; min-width:0}
/* wordmark is width-driven: 40vw on phones for prominence without dominance,
   climbing to a 400px ceiling on desktop */
h1 img{display:block; width:clamp(150px, 40vw, 400px); height:auto; object-fit:contain}

/* unit override — muted, secondary. Default is inferred from locale. */
.units{display:flex; align-items:center; gap:1px; flex:0 0 auto}
.units button{font-family:var(--mono); font-size:12.5px; letter-spacing:.04em;
  background:none; border:0; padding:9px 7px; min-height:40px; cursor:pointer;
  color:var(--fog-faint); transition:color .2s; -webkit-tap-highlight-color:transparent}
.units button[aria-pressed="true"]{color:var(--fog)}
.units button:focus-visible{outline:2px solid var(--clear); outline-offset:2px; border-radius:3px}
.units s{text-decoration:none; color:var(--fog-faint); font-family:var(--mono); font-size:11px}

svg.g{fill:currentColor}

.sub{max-width:46ch; color:var(--fog); font-size:16px; margin:0 0 20px}

/* ══ verdict — the answer, as the map's header ═════════════════
   No tile behind the glyph: the mark stands on the page ground and
   carries the accent, so icon and name together read as the pick. */
.verdict{padding-bottom:17px; margin-bottom:14px; border-bottom:1px solid var(--line)}
.v-row{display:flex; align-items:center; gap:13px}
.v-ico{flex:0 0 auto; color:var(--clear); display:grid; place-items:center}
.v-ico svg{width:38px; height:38px; display:block}
.v-name{display:block; font-family:var(--disp); font-weight:700; font-size:27px;
  line-height:1.04; letter-spacing:-.026em; color:var(--clear)}
.v-area{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--fog-dim); margin-top:5px}
.v-row.quiet .v-ico,.v-row.quiet .v-name{color:var(--fog)}
.v-stat{display:flex; align-items:center; gap:15px; margin-top:16px}
.v-temp{font-family:var(--disp); font-weight:700; font-size:42px; line-height:1;
  letter-spacing:-.04em; color:var(--paper)}
.v-cond{font-family:var(--mono); font-size:12.5px; line-height:1.7; color:var(--fog-dim)}
.v-cond b{color:var(--fog); font-weight:400}
.v-line{margin:14px 0 0; font-size:16px; line-height:1.4; color:var(--fog)}

/* ══ time scrubber ═════════════════════════════════════════════ */
.timebar{margin-top:15px; padding-top:13px; border-top:1px solid var(--line)}
.tb-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px}
.tb-at{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:-.022em; color:var(--paper)}
.tb-rel{font-family:var(--mono); font-size:11px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--fog-dim)}
/* the thumb is Karl. You drag him off the city. */
#time{-webkit-appearance:none; appearance:none; width:100%; height:46px;
  margin:0; display:block; background:transparent; cursor:grab; --p:0%}
#time:active{cursor:grabbing}
#time::-webkit-slider-runnable-track{height:3px; border-radius:2px;
  background:linear-gradient(90deg,var(--clear-dim) 0 var(--p),var(--fog-faint) var(--p) 100%)}
#time::-moz-range-track{height:3px; border-radius:2px; background:var(--fog-faint)}
#time::-moz-range-progress{height:3px; border-radius:2px; background:var(--clear-dim)}
#time::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
  width:38px; height:38px; margin-top:-17.5px; border:0; background:transparent;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'%3E%3Cpath%20fill='%23F4F4F0'%20d='M160,40A88.09,88.09,0,0,0,81.29,88.67,64,64,0,1,0,72,216h88a88,88,0,0,0,0-176Z'/%3E%3C/svg%3E");
  background-size:contain; background-position:center; background-repeat:no-repeat;
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
#time::-moz-range-thumb{width:38px; height:38px; border:0; background:transparent;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'%3E%3Cpath%20fill='%23F4F4F0'%20d='M160,40A88.09,88.09,0,0,0,81.29,88.67,64,64,0,1,0,72,216h88a88,88,0,0,0,0-176Z'/%3E%3C/svg%3E");
  background-size:contain; background-position:center; background-repeat:no-repeat;
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
#time:hover::-webkit-slider-thumb,#time:active::-webkit-slider-thumb{transform:scale(1.15)}
#time:hover::-moz-range-thumb,#time:active::-moz-range-thumb{transform:scale(1.15)}
#time:focus-visible::-webkit-slider-thumb{transform:scale(1.15)}
#time:focus-visible{outline:2px solid var(--clear); outline-offset:4px; border-radius:4px}
.tb-scale{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--fog-faint)}

/* ══ ridge ══════════════════════════════════════════════════════ */
/* no container: the map sits directly on the page ground */
.ridge{margin-bottom:30px}
.ridge-head{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono);
  font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--fog-dim); margin-bottom:9px}
.ridge-head b{color:var(--fog); font-weight:400; text-align:center}
.stage{position:relative; width:100%; aspect-ratio:900/250}
.stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.dot{position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%;
  background:var(--fog-faint); border:1px solid var(--fog-dim);
  transition:background .18s linear, border-color .18s linear}
.dot.on{background:var(--clear); border-color:var(--clear)}
.dot.pick{width:26px; height:26px; margin:-13px 0 0 -13px; background:none; border:none;
  color:var(--clear); display:grid; place-items:center}
.dot.pick svg{width:100%; height:100%}
/* label rail: horizontal names in staggered rows, a tick per dot.
   Labels carry the container ground as background and sit above the
   ticks, so a tick crossing a row is masked — no line-over-name. */
.rail{position:relative; height:68px}
.rail .r0{--row:0}.rail .r1{--row:1}.rail .r2{--row:2}.rail .r3{--row:3}
.rail i{position:absolute; top:0; width:1px; margin-left:-.5px; z-index:0;
  height:calc(5px + var(--row)*15px); background:var(--fog-faint)}
.rail i.on{background:var(--clear-dim)}
.rail b{position:absolute; top:calc(6px + var(--row)*15px); transform:translateX(-50%);
  font-family:var(--disp); font-size:11.5px; font-weight:400; letter-spacing:0;
  color:var(--fog); white-space:nowrap; line-height:1.3;
  background:var(--ink); padding:0 3px; z-index:1}
.rail b.el{transform:none}
.rail b.er{transform:translateX(-100%)}
.rail b.on{color:var(--clear)}
.rail b.pick{font-weight:700}
@media(max-width:374px){ .rail b{font-size:10.5px} }

/* ══ full data ══════════════════════════════════════════════════ */
.ph{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--fog-dim); margin:0 0 4px; padding-bottom:9px; border-bottom:1px solid var(--line-hi);
  display:flex; justify-content:space-between; gap:10px}
.ph b{color:var(--clear); font-weight:400}
.tr{display:grid; grid-template-columns:22px 26px 1fr 62px; gap:10px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line)}
.rk{font-family:var(--mono); font-size:12px; color:var(--fog-faint)}
.ri{color:var(--fog-dim); display:grid; place-items:center}
.ri svg{width:22px; height:22px}
.tr.top .ri{color:var(--clear)}
.nm{font-size:16px; font-weight:500; line-height:1.25}
.nm em{font-style:normal; display:block; font-size:13px; color:var(--fog-dim); font-weight:400; margin-top:2px}
.strip{display:block; font-family:var(--mono); font-size:12px; color:var(--fog-dim); margin-top:5px}
.strip s{text-decoration:none; color:var(--fog)}
.sc{text-align:right}
.sc u{font-family:var(--mono); font-size:14px; text-decoration:none; color:var(--fog); display:block; margin-bottom:5px}
.bar{height:4px; background:var(--fog-faint); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--fog-dim); transition:width .18s linear}
.tr.top .bar i{background:var(--clear)}
.tr.top .nm,.tr.top .sc u{color:var(--clear)}

.method{margin-top:26px; padding-top:15px; border-top:1px solid var(--line);
  font-family:var(--mono); font-size:12px; line-height:1.85; color:var(--fog-dim)}
.method b{color:var(--fog); font-weight:400}
.attr{margin-top:18px; font-family:var(--mono); font-size:11px; line-height:1.8; color:var(--fog-faint)}
.attr a{color:var(--fog-dim)}

@media(min-width:560px){
  :root{--pad:24px}
  h1 img{width:clamp(240px, 34vw, 400px)}
  .stage{aspect-ratio:900/220}
  .rail{height:40px}
  .rail .d0{--row:0}.rail .d1{--row:1}
  .rail b{font-size:12px}
  .v-name{font-size:30px}
  .v-ico svg{width:44px; height:44px}
  .tr{grid-template-columns:26px 30px 1fr 88px; gap:14px}
}
@media(min-width:860px){ .stage{aspect-ratio:900/190} }
@media(prefers-reduced-motion:reduce){
  .dot,.bar i,#time::-webkit-slider-thumb,#time::-moz-range-thumb{transition:none}
}
</style>
</head>

<div class="wrap">

  <div class="titlerow">
    <h1><img src="logo.png" alt="Karl" width="638" height="196"></h1>
    <div class="units" id="units" role="group" aria-label="Temperature unit">
      <button data-u="C" aria-pressed="false">°C</button><s>/</s><button data-u="F" aria-pressed="true">°F</button>
    </div>
  </div>

  <p class="sub">Karl doesn't own the whole city. Here's where he isn't.</p>

  <div class="ridge">
    <div class="verdict" id="verdict" aria-live="polite"></div>
    <div class="ridge-head"><span>← West</span><b id="ridgeState">Marine layer</b><span>East →</span></div>
    <div class="stage">
      <svg viewBox="0 0 900 250" preserveAspectRatio="none" aria-label="Cross section of San Francisco from Ocean Beach to India Basin showing where low cloud sits against the Twin Peaks ridge">
        <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#A9B7BE" stop-opacity=".55"/>
          <stop offset="70%" stop-color="#A9B7BE" stop-opacity=".30"/>
          <stop offset="100%" stop-color="#A9B7BE" stop-opacity="0"/>
        </linearGradient></defs>
        <path id="fogBody" d="" fill="url(#fg)"/>
        <path id="terrain" d="" fill="#1E2B33" stroke="rgba(169,183,190,.34)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <div id="dots"></div>
    </div>
    <div class="rail" id="rail"></div>

    <div class="timebar">
      <div class="tb-head"><span class="tb-at" id="tbAt">Now</span><span class="tb-rel" id="tbRel">Live</span></div>
      <input type="range" id="time" min="0" max="47" step="1" value="0"
             aria-label="Time, hours from now" aria-valuetext="Now">
      <div class="tb-scale"><span>Now</span><span>+24h</span><span>+48h</span></div>
    </div>
  </div>

  <h2 class="ph"><span>All twelve spots</span><b id="sliceTag">Now</b></h2>
  <div id="board"></div>

  <div class="method" id="method"></div>
  <p class="attr">
    Weather data by <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a>, CC BY 4.0.
    Non-commercial use. Fog climatology is a static local estimate, not measured.
  </p>
</div>

 fogx:'<path d="M120,208H72a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Zm64-16H160a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Zm-24,32H104a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Zm72-124a76.08,76.08,0,0,1-76,76H76A52,52,0,0,1,76,72a53.26,53.26,0,0,1,8.92.76A76.08,76.08,0,0,1,232,100Zm-16,0A60.06,60.06,0,0,0,96,96.46a8,8,0,0,1-16-.92q.21-3.66.77-7.23A38.11,38.11,0,0,0,76,88a36,36,0,0,0,0,72h80A60.07,60.07,0,0,0,216,100Z"/>',
 sun:'<path d="M116,36V20a12,12,0,0,1,24,0V36a12,12,0,0,1-24,0Zm80,92a68,68,0,1,1-68-68A68.07,68.07,0,0,1,196,128Zm-24,0a44,44,0,1,0-44,44A44.05,44.05,0,0,0,172,128ZM51.51,68.49a12,12,0,1,0,17-17l-12-12a12,12,0,0,0-17,17Zm0,119-12,12a12,12,0,0,0,17,17l12-12a12,12,0,1,0-17-17ZM196,72a12,12,0,0,0,8.49-3.51l12-12a12,12,0,0,0-17-17l-12,12A12,12,0,0,0,196,72Zm8.49,115.51a12,12,0,0,0-17,17l12,12a12,12,0,0,0,17-17ZM48,128a12,12,0,0,0-12-12H20a12,12,0,0,0,0,24H36A12,12,0,0,0,48,128Zm80,80a12,12,0,0,0-12,12v16a12,12,0,0,0,24,0V220A12,12,0,0,0,128,208Zm108-92H220a12,12,0,0,0,0,24h16a12,12,0,0,0,0-24Z"/>'
};
const ico=(k,cls)=>`<svg class="g ${cls||''}" viewBox="0 0 256 256" aria-hidden="true">${G[k]}</svg>`;

const SPOTS=[
 {n:"Ocean Beach",          a:"Outer Sunset",    g:"wave", lat:37.7590,lon:-122.5100,rel:26,x:40,y:218,m:"Ocean Beach"},
 {n:"Golden Gate Park",     a:"Conservatory",    g:"tree", lat:37.7720,lon:-122.4600,rel:48,x:232,y:200,m:"GG Park"},
 {n:"Twin Peaks",           a:"the ridge",       g:"peak", lat:37.7544,lon:-122.4477,rel:55,x:307,y:104,m:"Twin Peaks"},
 {n:"Glen Canyon Park",     a:"Glen Park",       g:"tree", lat:37.7400,lon:-122.4430,rel:68,x:360,y:158,m:"Glen Park"},
 {n:"Corona Heights",       a:"Castro",          g:"peak", lat:37.7650,lon:-122.4380,rel:62,x:414,y:142,m:"Corona"},
 {n:"Fort Mason",           a:"Marina Green",    g:"sail", lat:37.8060,lon:-122.4320,rel:52,x:470,y:190,m:"Fort Mason"},
 {n:"Mission Dolores Park", a:"Mission",         g:"palm", lat:37.7596,lon:-122.4269,rel:78,x:522,y:196,m:"Mission"},
 {n:"McLaren Park",         a:"Excelsior",       g:"tree", lat:37.7180,lon:-122.4180,rel:79,x:578,y:172,m:"McLaren"},
 {n:"Bernal Heights Park",  a:"Bernal",          g:"peak", lat:37.7431,lon:-122.4160,rel:82,x:640,y:156,m:"Bernal"},
 {n:"Potrero Hill",         a:"McKinley Square", g:"slope",lat:37.7600,lon:-122.3990,rel:84,x:722,y:182,m:"Potrero"},
 {n:"Crane Cove Park",      a:"Dogpatch",        g:"crane",lat:37.7615,lon:-122.3872,rel:85,x:794,y:212,m:"Dogpatch"},
 {n:"India Basin",          a:"Bayview",         g:"crane",lat:37.7370,lon:-122.3775,rel:88,x:860,y:218,m:"Bayview"}
];
/* one profile. clarity-forward, since fog is the whole point;
   ideal sits at 66°F, the midpoint of the old Move/Chill pair. */
const W={c:.42, v:.13, w:.22, t:.23, ideal:66};
const HOURS=48, VBW=900, VBH=250, GROUND=246;

/* Catmull-Rom → cubic bezier, so the section reads as rolling ground */
function smooth(pts){
  const p=[{x:-70,y:pts[0].y+8},...pts,{x:VBW+70,y:pts[pts.length-1].y+6}];
  let d=`L${p[1].x},${p[1].y}`;
  for(let i=1;i<p.length-2;i++){
    const a=p[i-1],b=p[i],c=p[i+1],e=p[i+2],k=7;
    d+=` C${(b.x+(c.x-a.x)/k).toFixed(1)},${(b.y+(c.y-a.y)/k).toFixed(1)}`
      +` ${(c.x-(e.x-b.x)/k).toFixed(1)},${(c.y-(e.y-b.y)/k).toFixed(1)} ${c.x},${c.y}`;
  }
  return d;
}
const RIDGE=[{x:0,y:224},...SPOTS.map(s=>({x:s.x,y:s.y})),{x:VBW,y:222}];

const $=i=>document.getElementById(i), cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const TZ="America/Los_Angeles";

/* ── unit system: inferred from locale, overridable ─────────────
   Fahrenheit is used by the US, Liberia, Myanmar and a handful of
   Caribbean and Pacific territories. Everywhere else is Celsius. */
const F_REGIONS=new Set(["US","LR","MM","BS","BZ","KY","PW","FM","MH","GU","PR","VI","AS","MP","TC","MS","AG","KN"]);
function inferUnit(){
  try{
    const loc=new Intl.Locale(navigator.language);
    if(loc.measurementSystem) return loc.measurementSystem==="us" ? "F" : "C";
    const r=(loc.maximize&&loc.maximize().region)||loc.region;
    return F_REGIONS.has(r) ? "F" : "C";
  }catch(e){ return "F"; }
}
let S={unit:inferUnit(), h:0, frames:null};

const t2 = f => S.unit==="C" ? Math.round((f-32)*5/9) : Math.round(f);
const w2 = m => S.unit==="C" ? Math.round(m*1.609) : Math.round(m);
const wu = () => S.unit==="C" ? "km/h" : "mph";

const fmtH=e=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric"}).format(new Date(e*1000));
const fmtD=e=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(new Date(e*1000));
const stamp=(t,k)=> k===0 ? "Now" : `${fmtD(t)} ${fmtH(t)}`;
const relLabel=k=> k===0 ? "Live" : `+${k}h`;

/* score always computed in °F and mph — display units never touch it */
function score(d){return Math.round(
  (100-cl(d.lowCloud,0,100))*W.c + (cl(d.vis/16000,0,1)*100)*W.v +
  (100-cl((d.wind-8)*5,0,100))*W.w + (100-cl(Math.abs(d.temp-W.ideal)*5.5,0,100))*W.t);}

/* ── fallback: 48 hours of SF fog behaviour ────────────────────
     Diurnal cycle peaks near 5am and burns off mid-afternoon, with a
     deep marine push building on the second day so the sweep covers
     the socked-in case the quiet rule exists for. Hour-of-day is read
     in SF time, not the viewer's — the cycle belongs to the city. */
function simulate(){
  const now=Math.floor(Date.now()/1000);
  const h0=+new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",hour12:false})
             .format(new Date());
  const out=[];
  for(let k=0;k<HOURS;k++){
    const hr=(h0+k)%24;
    const diurnal=cl(50+38*Math.cos((hr-5)/24*2*Math.PI),0,100);
    const deep=cl((k-26)/12,0,1);                 /* Karl takes the city */
    const push=cl(diurnal+deep*26,0,100);
    out.push({t:now+k*3600, spots:SPOTS.map(s=>{
      const ex=(100-s.rel)/100;
      const low=cl(Math.max(push*1.55*ex-8, deep*92*(.78+.22*ex)),0,100);
      return {...s, lowCloud:low, temp:70-low*.17-push*.03,
              wind:6+push*.11+ex*13, vis:low>70?1800:16000-low*100};
    })});
  }
  return out;
}

/* ── live: every hour reads the same hourly array, so the whole
     48-hour sweep is internally consistent ─────────────────────── */
async function fetchLive(){
  const u="https://api.open-meteo.com/v1/forecast"
   +"?latitude="+SPOTS.map(s=>s.lat).join(",")+"&longitude="+SPOTS.map(s=>s.lon).join(",")
   +"&hourly=temperature_2m,cloud_cover_low,visibility,wind_speed_10m"
   +"&forecast_days=3&timeformat=unixtime&temperature_unit=fahrenheit"
   +"&wind_speed_unit=mph&timezone="+TZ;
  const c=new AbortController(), to=setTimeout(()=>c.abort(),8000);
  const r=await fetch(u,{signal:c.signal}); clearTimeout(to);
  if(!r.ok) throw new Error(r.status);
  const j=await r.json(), A=Array.isArray(j)?j:[j];
  const T=A[0].hourly.time, now=Math.floor(Date.now()/1000);
  let base=T.findIndex(t=>t>now); base=base<1?0:base-1;
  const out=[];
  for(let k=0;k<HOURS;k++){
    const i=Math.min(base+k,T.length-1);
    out.push({t:T[i], spots:SPOTS.map((s,n)=>{
      const h=A[n].hourly;
      return {...s, lowCloud:h.cloud_cover_low[i]??0, temp:h.temperature_2m[i],
              wind:h.wind_speed_10m[i], vis:h.visibility[i]??16000};
    })});
  }
  return out;
}

const rankAt=k=>S.frames[k].spots.map(d=>({...d,score:score(d)}))
                 .sort((a,b)=>b.score-a.score||b.rel-a.rel);

/* ── the answer, sitting on top of the map ─────────────────────── */
function paintVerdict(rk,fr,k){
  const top=rk[0], next=rk[1], worst=rk[rk.length-1];
  if(top.score<55){                     /* quiet rule */
    $("verdict").innerHTML=`<div class="v-row quiet">
      <span class="v-ico">${ico("fogx")}</span>
      <span><span class="v-name">Nothing's clear</span><span class="v-area">City-wide</span></span></div>
      <div class="v-stat"><span class="v-temp">—</span>
        <span class="v-cond">low cloud<br><b>Ocean Beach to the Bay</b></span></div>
      <p class="v-line">${k===0
        ? "I'd rather stay quiet than send you somewhere grey."
        : "Scrub the slider — it lifts later."}</p>`;
    return;
  }
  $("verdict").innerHTML=`<div class="v-row">
    <span class="v-ico">${ico(top.g)}</span>
    <span><span class="v-name">${top.n}</span><span class="v-area">${top.a}</span></span></div>
    <div class="v-stat"><span class="v-temp">${t2(top.temp)}°</span>
      <span class="v-cond"><b>${Math.round(top.lowCloud)}%</b> low cloud<br>
        <b>${w2(top.wind)}</b> ${wu()} wind</span></div>
    <p class="v-line">${next.n} is the backup at ${t2(next.temp)}°. ${worst.n} stays socked in.</p>`;
}

function paint(){
  const k=S.h, fr=S.frames[k], rk=rankAt(k);
  paintVerdict(rk,fr,k);
  $("tbAt").textContent=stamp(fr.t,k);
  $("time").style.setProperty("--p",(k/(HOURS-1)*100).toFixed(1)+"%");
  $("tbRel").textContent=relLabel(k);
  $("time").setAttribute("aria-valuetext",stamp(fr.t,k));
  $("sliceTag").textContent=stamp(fr.t,k);

  $("board").innerHTML=rk.map((s,i)=>`
    <div class="tr ${i===0?'top':''}">
      <span class="rk">${String(i+1).padStart(2,"0")}</span>
      <span class="ri">${ico(s.g)}</span>
      <span><span class="nm">${s.n}<em>${s.a}</em></span>
        <span class="strip"><s>${t2(s.temp)}°</s> · ${w2(s.wind)} ${wu()} · ${Math.round(s.lowCloud)}% low cloud · ${s.rel}% clear yr</span></span>
      <span class="sc"><u>${s.score}</u><span class="bar"><i style="width:${s.score}%"></i></span></span>
    </div>`).join("");

  const pick=rk[0].score>=55?rk[0].n:null;   /* no pick, no sun */
  $("dots").innerHTML=fr.spots.map(s=>{
    const on=s.lowCloud<45, p=s.n===pick;
    return `<span class="dot ${on?'on':''} ${p?'pick':''}" title="${s.n}"
      style="left:${(s.x/VBW*100).toFixed(2)}%; top:${(s.y/VBH*100).toFixed(2)}%">${p?ico("sun"):""}</span>`;
  }).join("");
  $("rail").innerHTML=fr.spots.map((s,j)=>{
    const on=s.lowCloud<45, L=(s.x/VBW*100).toFixed(2),
          rows=`r${j%4} d${j%2}`,
          edge=j===0?'el':(j===fr.spots.length-1?'er':'');
    return `<i class="${rows} ${on?'on':''}" style="left:${L}%"></i>`
         + `<b class="${rows} ${edge} ${on?'on':''} ${s.n===pick?'pick':''}" style="left:${L}%">${s.m}</b>`;
  }).join("");

  const w=fr.spots.slice(0,4).reduce((t,s)=>t+s.lowCloud,0)/4,
        e=fr.spots.slice(-4).reduce((t,s)=>t+s.lowCloud,0)/4,
        wy=GROUND-w*1.55, ey=GROUND-e*1.55;
  $("fogBody").setAttribute("d",
    `M0,${GROUND} L0,${wy} C240,${wy-18} 330,${wy+12} 400,${(wy+ey)/2} C520,${ey-10} 700,${ey} ${VBW},${ey} L${VBW},${GROUND} Z`);
  $("ridgeState").textContent=w>60?(e>55?"City-wide marine layer":"Fog held at the ridge"):"Clear west to east";

  $("method").innerHTML=`<b>Score</b> = clarity×${W.c} + visibility×${W.v} + wind comfort×${W.w} + temperature fit×${W.t}. `+
   `<b>Clarity</b> = 100 − low cloud. <b>Wind comfort</b> falls off above 8 mph. `+
   `<b>Temperature fit</b> centers on ${t2(W.ideal)}°${S.unit}. `+
   `<b>Clear yr</b> is a static climatology estimate, not measured, used as the tiebreak. `+
   `<b>Quiet rule</b>: no place is named below a score of 55.`;
}

$("terrain").setAttribute("d", `M0,${GROUND} `+smooth(RIDGE)+` L${VBW},${GROUND} Z`);

/* ── controls ──────────────────────────────────────────────────── */
$("time").addEventListener("input",e=>{ S.h=+e.target.value; paint(); },{passive:true});
$("units").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  S.unit=b.dataset.u;
  [...$("units").querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  paint();
});

(async()=>{
  [...$("units").querySelectorAll("button")]
    .forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.u===S.unit)));
  try{ S.frames=await fetchLive(); }
  catch(err){ S.frames=simulate(); }
  paint();
})();
})();
</script>
</body>
