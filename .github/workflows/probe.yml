name: probe
# Prints what the Previous Runs API supports. Tooling only.
on:
  push:
    branches: [lead-time]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/probe.js | tee probe.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf -q --cached .
          mkdir -p out && cp probe.txt out/
          git add -f out && git commit -q -m "Probe output" && git push -f origin probe-results
